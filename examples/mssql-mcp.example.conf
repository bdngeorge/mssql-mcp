# Example config for NGINX usage
server {
  listen 80 default_server;
  server_name _;

  location /mcp {
    proxy_pass http://mssql-mcp:8199/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

