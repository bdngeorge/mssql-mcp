# Docker Compose (Reverse Proxied)
# ===============================================
# Joins the shared `proxy` network so a reverse proxy
# (run separately) can front this container
# and make it accessible to other machines
# ===============================================

services:
  mssql-mcp:
    container_name: mssql-mcp
    image: mssql-mcp:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8199:8199"
    networks:
      - proxy
    env_file: .env
    volumes:
      - ./config.json:/app/config.json:ro

networks:
  proxy:
    name: proxy
    external: true
